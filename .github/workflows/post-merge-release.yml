name: Post-Merge Release Update

on:
  push:
    branches: [master, main]

permissions:
  contents: write

jobs:
  release-update:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update build version + changelog
        run: python tools/post_merge_release.py

      - name: Commit and push release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_VERSION CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No release metadata changes"
            exit 0
          fi
          BUILD_NUMBER="$(cat BUILD_VERSION)"
          git commit -m "chore(release): build ${BUILD_NUMBER} [skip ci]"
          git push
